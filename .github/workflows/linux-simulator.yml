name: Linux Simulator

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-release:
    name: Linux GCC Debug and Release Simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/out/vcpkg-cache,readwrite

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native dependency build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build git curl zip unzip tar pkg-config \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev xvfb xauth fonts-dejavu-core

      - name: Restore vcpkg binary archives
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/vcpkg-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Create vcpkg binary archive directory
        run: cmake -E make_directory "${{ github.workspace }}/out/vcpkg-cache"

      - name: Set up pinned vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          vcpkgJsonGlob: '**/vcpkg.json'
          doNotCache: false

      - name: Configure Debug simulator without pylon
        run: cmake --preset linux-gcc-debug-sim --fresh -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DLUMORA_TEST_LINUX_DESKTOP=ON

      - name: Build Debug targets
        run: cmake --build --preset linux-gcc-debug-sim --parallel

      - name: Test Debug without hardware
        run: ctest --preset linux-gcc-debug-sim --output-on-failure -LE 'hardware|desktop'

      - name: Test Debug desktop window on X11
        run: xvfb-run -a ctest --preset linux-gcc-debug-sim --output-on-failure -L desktop --no-tests=error

      - name: Configure Release simulator without pylon
        run: cmake --preset linux-gcc-release-sim --fresh -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DLUMORA_TEST_LINUX_DESKTOP=ON

      - name: Build Release targets
        run: cmake --build --preset linux-gcc-release-sim --parallel

      - name: Test Release without hardware
        run: ctest --preset linux-gcc-release-sim --output-on-failure -LE 'hardware|desktop'

      - name: Test Release desktop window on X11
        run: xvfb-run -a ctest --preset linux-gcc-release-sim --output-on-failure -L desktop --no-tests=error

      - name: Save completed vcpkg binary archives
        if: ${{ !cancelled() && steps.vcpkg-cache.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
