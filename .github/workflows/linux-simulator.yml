name: Linux Simulator

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-release:
    name: Linux GCC Release Simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pinned vcpkg and binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          vcpkgJsonGlob: '**/vcpkg.json'
          doNotCache: false

      - name: Configure Release simulator without pylon
        run: cmake --preset linux-gcc-release-sim --fresh -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build all targets
        run: cmake --build --preset linux-gcc-release-sim --parallel

      - name: Test without hardware
        run: ctest --preset linux-gcc-release-sim --output-on-failure -LE hardware
